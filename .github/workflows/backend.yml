name: Backend CI/CD

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['server/**'] # only when backend code changes

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        environment: qc-aws-environment
        steps:
          - uses: actions/checkout@v4
          - name: Build and push
            run: bash scripts/build-and-push.sh
            env:
                DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
                DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
                REPOSITORY: quick-chat
                SUB_REPOSITORY: server
                VERSION: v1.0

    deploy:
        needs: build-and-push # only after the image is pushed
        environment: qc-aws-environment
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Deploy to EC2
              run: bash scripts/deploy.sh
              env:
                DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
                REPOSITORY: quick-chat
                VERSION: v1.0
                SUB_REPOSITORY: server
                SERVICE_NAME: qc-server
                EC2_HOST: ${{ secrets.EC2_HOST }}
                EC2_USER: ${{ secrets.EC2_USER }}
                EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
