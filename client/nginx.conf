server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy HTTP API requests
    location /api/ {
        proxy_pass http://host.docker.internal:5050/api/;
    }

    # Proxy WebSockets for Socket.IO
    location /socket.io/ {
        proxy_pass http://host.docker.internal:5050/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }
}
