events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Needed for socket.io / websockets
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream qc_api_servers {
        least_conn;
        server qc-api1:5050 max_fails=3 fail_timeout=30s;
        server qc-api2:5050 max_fails=3 fail_timeout=30s;
        server qc-api3:5050 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 80;

        location /api/ {
            proxy_pass http://qc_api_servers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Useful to verify load balancing behavior
            add_header X-Served-By $upstream_addr always;
        }

        location /socket.io/ {
            proxy_pass http://qc_api_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend is hosted on S3; this endpoint is backend-only.
        location / {
            return 404;
        }
    }
}
