events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream qc_api_servers {
        ip_hash;
        server qc-api1:5050 max_fails=3 fail_timeout=30s;
        server qc-api2:5050 max_fails=3 fail_timeout=30s;
        server qc-api3:5050 max_fails=3 fail_timeout=30s;
    }

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name api.quick-chat.narayanlohani.com.np;
        return 301 https://$host$request_uri;
    }

    # HTTPS Server Block
    server {
        listen 443 ssl;
        server_name api.quick-chat.narayanlohani.com.np;

        ssl_certificate /etc/letsencrypt/live/api.quick-chat.narayanlohani.com.np/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.quick-chat.narayanlohani.com.np/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location /api {
            proxy_pass http://qc_api_servers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header X-Served-By $upstream_addr always;
        }

        location /socket.io/ {
            proxy_pass http://qc_api_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        location / {
            return 404;
        }
    }
}
