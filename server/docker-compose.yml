services:
    nginx:
        image: nginx:alpine
        ports:
            - "80:80"
        volumes:
            - ./nginx.conf:/etc/nginx/nginx.conf:ro
            - ../client/dist:/usr/share/nginx/html:ro
        depends_on:
            - qc-api1
            - qc-api2
            - qc-api3

    qc-api1: &qc-api
        build: .
        env_file:
            - ../env/server/.env
        environment:
            - INSTANCE_ID=qc-api1

    qc-api2:
        <<: *qc-api
        environment:
            - INSTANCE_ID=qc-api2

    qc-api3:
        <<: *qc-api
        environment:
            - INSTANCE_ID=qc-api3
